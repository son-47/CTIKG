version: '3.8'

services:
  # --- Service 1: Ứng dụng chính (CTINexus) ---
  ctinexus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctinexus_app
    ports:
      - "8000:8000"
      - "57623-57628:57623-57628"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=8000
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      # Ghi đè cấu hình để container gọi sang container Neo4j (quan trọng)
      - NEO4J_URI=bolt://neo4j:7687 
    env_file:
      - .env
    networks:
      - ctinexus_network
    volumes:
      - .:/app
    depends_on:
      - neo4j  # Đợi Neo4j chạy xong mới chạy app

  # --- Service 2: Database Neo4j + APOC ---
  neo4j:
    image: neo4j:5.19.0-community
    container_name: ctinexus_neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    environment:
      # Lấy pass từ .env hoặc dùng mặc định neo4j/password
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      
      # --- CẤU HÌNH BẮT BUỘC ĐỂ CHẠY APOC ---
      # 1. Tải plugin APOC
      - NEO4J_PLUGINS=["apoc"]
      # 2. Cho phép APOC chạy các thủ tục không giới hạn
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      # 3. (Tùy chọn) Whitelist thủ tục
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      
      # Tăng bộ nhớ Heap nếu load file lớn (tùy chỉnh nếu cần)
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
    networks:
      - ctinexus_network
    restart: unless-stopped

networks:
  ctinexus_network:
    driver: bridge

volumes:
  # Tạo volume bền vững cho dữ liệu Neo4j
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  # (Giữ lại nếu bạn dùng falkordb ở đâu đó, nếu không có thể xóa)
  falkordb_data:
